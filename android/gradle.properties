org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Gradle's default HTTP timeouts are effectively infinite. A dependency
# download that stalls mid-transfer therefore hangs the whole build forever
# rather than failing — this happened once here, blocking a build for 25
# minutes on a half-open TLS connection with no output at all.
# These make a stalled transfer fail fast so it can be retried.
systemProp.org.gradle.internal.http.socketTimeout=60000
systemProp.org.gradle.internal.http.connectionTimeout=60000

# Kotlin incremental compilation is disabled because it fails reproducibly on
# this toolchain (Kotlin 2.3.20 + Gradle 9.1 + AGP 9.0.1 on Windows):
#   :flutter_timezone:compileDebugKotlin
#   > Could not close incremental caches in ...caches-jvm/jvm/kotlin:
#     class-fq-name-to-source.tab, source-to-classes.tab
# It fails on a clean cache too, so it is not corruption left by an
# interrupted build. Full recompilation of the few Kotlin plugin modules costs
# seconds; the incremental path costs a build that never completes.
kotlin.incremental=false

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Gradle's default HTTP timeouts are effectively infinite. A dependency
# download that stalls mid-transfer therefore hangs the whole build forever
# rather than failing — this happened once here, blocking a build for 25
# minutes on a half-open TLS connection with no output at all.
# These make a stalled transfer fail fast so it can be retried.
systemProp.org.gradle.internal.http.socketTimeout=60000
systemProp.org.gradle.internal.http.connectionTimeout=60000

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
